<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F7F4" />
    <title>Зоряна Тепла — лікар ортодонт у Києві</title>
    <meta
      name="description"
      content="Зоряна Тепла — стоматолог-ортодонт у Києві. 20+ років досвіду. Ортодонтичне лікування дітей і дорослих, брекети, елайнери та діагностика прикусу."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      try {
        var teplaTheme = localStorage.getItem('tepla-theme')
        var teplaDark =
          teplaTheme === 'dark' ||
          (teplaTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = teplaDark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = teplaDark ? 'dark' : 'light'
      } catch (_) {}
    </script>
    <!--seo-->
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
